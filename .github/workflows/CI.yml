name: CI
on:
  push:
    branches:
      - main
      - dev
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # the minimum [compat] promises, the current stable, the upcoming release
          - {os: ubuntu-latest, arch: x64, version: '1.10'}
          - {os: ubuntu-latest, arch: x64, version: '1'}
          - {os: ubuntu-latest, arch: x64, version: 'pre'}
          # Apple Silicon: reachable since MKL stopped being a hard dependency
          - {os: macos-latest, arch: aarch64, version: '1'}
          # Windows: test/checkpoint.jl is the only group that touches the disk, changing
          # the working directory and leaving files behind, which is where a difference
          # would show. Whether it actually does had never been tried
          - {os: windows-latest, arch: x64, version: '1'}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # the tests already run instrumented: `coverage` defaults to true in julia-runtest,
      # so collecting the result costs nothing more than gathering the .cov files
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      # The examples cost minutes rather than seconds, so they are not a test group and
      # the suite does not run them. One job of the matrix does, which is enough to catch
      # the day one of them stops working, and it runs last so that a failure there does
      # not cost the coverage of a run whose tests passed.
      - name: Run the examples
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        run: julia --project=. test/run_examples.jl
  downgrade:
    # the jobs above resolve the latest versions [compat] allows, so its lower bounds are never
    # met there. This one resolves the lowest ones, on the lowest Julia, which matters all the
    # more as the package leans on functions ITensors and ITensorMPS do not export
    name: Julia 1.10 - lowest compatible versions - ${{ github.event_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          allow_reresolve: false
          force_latest_compatible_version: false
